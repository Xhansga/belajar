<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetLab – Simulator Jaringan Komputer</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f1f5f4;--grid:#d9e3e1;--ink:#13293d;--mute:#586e80;--line:#c3d1d0;--accent:#e4572e;--ok:#1b8a5a;--bad:#c0392b;--panel:#fbfdfc;--term:#0f2233;--termfg:#c8f3dd}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif;color:var(--ink);background:var(--paper);display:grid;grid-template-rows:auto 1fr;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:19px;margin:0 8px 0 0;letter-spacing:-.01em}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
button{font:inherit;border:1px solid var(--ink);background:#fff;color:var(--ink);padding:5px 11px;border-radius:5px;cursor:pointer}
button:hover{background:#e6eeee}
button.on{background:var(--ink);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
main{display:grid;grid-template-columns:1fr 320px;grid-template-rows:1fr 210px;min-height:0}
#stage{position:relative;min-height:0;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:30px 30px}
svg{width:100%;height:100%;display:block;touch-action:none}
#msg{position:absolute;left:12px;bottom:10px;background:var(--ink);color:#fff;padding:4px 10px;border-radius:5px;font-size:13px;max-width:90%}
aside{grid-row:1/3;grid-column:2;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
aside h3{margin:0 0 8px;font-size:16px}
aside h4{margin:18px 0 6px;font-size:14px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 0}
input,textarea{width:100%;font:14px "IBM Plex Mono",monospace;padding:5px 7px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
input.invalid{border-color:var(--bad);background:#fdeceb}
fieldset{border:1px solid var(--line);border-radius:6px;margin:10px 0 0;padding:4px 8px 8px}
legend{font-size:13px;color:var(--mute);padding:0 4px}
fieldset input+input{margin-top:5px}
.hint{color:var(--mute);font-size:13px;margin:6px 0}
ul.mis{list-style:none;padding:0;margin:0}
ul.mis li{display:flex;gap:8px;padding:5px 0;font-size:13.5px;border-bottom:1px dashed var(--line)}
ul.mis li::before{content:"○";color:var(--mute)}
ul.mis li.done::before{content:"●";color:var(--ok)}
ul.mis li.done{color:var(--ok)}
#term{grid-column:1;background:var(--term);color:var(--termfg);display:flex;flex-direction:column;min-height:0;font:13.5px/1.5 "IBM Plex Mono",monospace}
#out{flex:1;overflow:auto;padding:8px 12px;white-space:pre-wrap}
#out .err{color:#ff9d8f}#out .sys{color:#8fb4c9}
#inrow{display:flex;align-items:center;border-top:1px solid #24435c;padding:4px 12px;gap:8px}
#prompt{color:#ffd28a;white-space:nowrap}
#cmd{border:0;background:transparent;color:#fff;flex:1;padding:4px 0}
#cmd:focus-visible{outline:0}
.dev{cursor:grab}.dev text{pointer-events:none}
.dev .shape{fill:#fff;stroke:var(--ink);stroke-width:2}
.dev.sel .shape{stroke:var(--accent);stroke-width:4}
.dev.pick .shape{stroke:var(--ok);stroke-width:4;stroke-dasharray:6 3}
.dev .name{font:600 13px "IBM Plex Sans",sans-serif;fill:var(--ink);text-anchor:middle}
.dev .ip{font:11.5px "IBM Plex Mono",monospace;fill:var(--mute);text-anchor:middle}
.dev .glyph{font:600 13px "IBM Plex Mono",monospace;fill:var(--ink);text-anchor:middle}
.cable{stroke:var(--ink);stroke-width:2.5}
@media(max-width:900px){
 body{overflow:auto;display:block}
 main{display:block}
 #stage{height:60vh}aside{border-left:0;border-top:1px solid var(--line)}
 #term{height:260px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
 <h1>NetLab · Simulator Jaringan</h1>
 <div class="tools" role="toolbar" aria-label="Alat">
  <button data-add="pc">+ PC</button>
  <button data-add="server">+ Server</button>
  <button data-add="switch">+ Switch</button>
  <button data-add="router">+ Router</button>
  <span class="sep"></span>
  <button data-mode="select" class="on">Pilih / Geser</button>
  <button data-mode="cable">Kabel</button>
  <button data-mode="delete">Hapus</button>
  <span class="sep"></span>
  <button id="btnEx">Muat contoh</button>
  <button id="btnClr">Kosongkan</button>
 </div>
</header>
<main>
 <section id="stage" aria-label="Kanvas topologi jaringan">
  <svg id="svg" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid meet"><g id="gL"></g><g id="gD"></g><g id="gP"></g></svg>
  <div id="msg">Mulai dengan menekan “Muat contoh”.</div>
 </section>
 <section id="term" aria-label="Terminal">
  <div id="out"></div>
  <div id="inrow"><span id="prompt">–&gt;</span><input id="cmd" autocomplete="off" spellcheck="false" aria-label="Perintah terminal" placeholder="ketik: bantuan"></div>
 </section>
 <aside>
  <div id="panel"></div>
  <h4>Misi belajar</h4>
  <ul class="mis" id="mis"></ul>
 </aside>
</main>
<script>
"use strict";
const $=s=>document.querySelector(s), NS="http://www.w3.org/2000/svg";
const TYPES={pc:{label:"PC",ports:1,pre:"PC"},server:{label:"Server",ports:1,pre:"SRV"},switch:{label:"Switch (Layer 2)",ports:8,pre:"SW"},router:{label:"Router (Layer 3)",ports:4,pre:"R"}};
let devs=[],links=[],sel=null,mode="select",pick=null,uid=1,busy=false;
const cnt={};
const flags={m1:0,m2:0,m3:0,m4:0};
const MISSIONS=[["m1","Ping berhasil antar dua perangkat dalam satu subnet"],["m2","Ping berhasil melewati router (beda subnet)"],["m3","Temukan satu kegagalan (mis. gateway salah) dan baca pesan error-nya"],["m4","Jalankan traceroute untuk melihat setiap hop"]];

/* ---------- Utilitas IP ---------- */
const ip2n=s=>{const p=String(s).trim().split(".");if(p.length!==4||p.some(x=>!/^\d{1,3}$/.test(x)||+x>255))return null;return((+p[0]<<24)|(+p[1]<<16)|(+p[2]<<8)|+p[3])>>>0};
const validMask=s=>{const n=ip2n(s);if(n===null)return false;const inv=(~n)>>>0;return((inv+1)&inv)===0};
const netOf=(ip,m)=>(ip2n(ip)&ip2n(m))>>>0;
const same=(ip,m,x)=>ip2n(ip)!==null&&validMask(m)&&ip2n(x)!==null&&netOf(ip,m)===netOf(x,m);
const maskLen=m=>ip2n(m).toString(2).replace(/0/g,"").length;
const ready=p=>ip2n(p.ip)!==null&&validMask(p.mask);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- Model ---------- */
const dev=id=>devs.find(d=>d.id===id);
function addDev(type,x,y,name){
 cnt[type]=(cnt[type]||0)+1;
 const d={id:uid++,type,x,y,name:name||TYPES[type].pre+cnt[type],gw:"",routes:[],routesText:"",
  ports:Array.from({length:TYPES[type].ports},()=>({ip:"",mask:"255.255.255.0"}))};
 devs.push(d);return d;
}
function peer(id,pi){
 for(const l of links){
  if(l.a===id&&l.pa===pi)return{dev:l.b,port:l.pb};
  if(l.b===id&&l.pb===pi)return{dev:l.a,port:l.pa};
 }
 return null;
}
const freePort=d=>d.ports.findIndex((_,i)=>!peer(d.id,i));
function connect(a,b){
 if(a===b)return say("Pilih dua perangkat yang berbeda.");
 if(links.some(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a)))return say("Dua perangkat itu sudah terhubung.");
 const A=dev(a),B=dev(b),pa=freePort(A),pb=freePort(B);
 if(pa<0||pb<0)return say("Port penuh pada "+(pa<0?A.name:B.name)+".");
 links.push({a,pa,b,pb});say("Kabel terpasang: "+A.name+" ↔ "+B.name);
}
function removeDev(id){
 devs=devs.filter(d=>d.id!==id);links=links.filter(l=>l.a!==id&&l.b!==id);
 if(sel===id)sel=null;
}

/* ---------- Mesin jaringan ---------- */
// Semua perangkat Layer 3 yang berada di satu broadcast domain (melewati switch)
function l2(id,pi){
 const out=[],seen=new Set();
 (function walk(fid,fp,via){
  const p=peer(fid,fp);if(!p)return;
  const d=dev(p.dev);
  if(d.type==="switch"){
   if(seen.has(d.id))return;seen.add(d.id);
   d.ports.forEach((_,i)=>{if(i!==p.port)walk(d.id,i,[...via,d.id])});
  }else out.push({dev:d.id,port:p.port,via});
 })(id,pi,[]);
 return out;
}
// Menghitung jalur paket dari perangkat src menuju IP tujuan
function route(srcId,dst){
 let cur=srcId,nodes=[srcId],hops=[],srcIp=null,ttl=16;
 const fail=m=>({ok:false,nodes,hops,msg:m,srcIp});
 while(ttl-->0){
  const d=dev(cur);
  if(d.ports.some(p=>p.ip.trim()===dst))return{ok:true,nodes,hops,srcIp:srcIp||dst};
  let out,nh;
  if(d.type==="router"){
   const i=d.ports.findIndex(p=>ready(p)&&same(p.ip,p.mask,dst));
   if(i>=0){out=i;nh=dst}
   else{
    let best=null;
    d.routes.forEach(r=>{if(same(r.net,r.mask,dst)&&(!best||maskLen(r.mask)>maskLen(best.mask)))best=r});
    if(!best)return fail("Destination net unreachable: "+d.name+" tidak punya rute ke "+dst);
    const j=d.ports.findIndex(p=>ready(p)&&same(p.ip,p.mask,best.nh));
    if(j<0)return fail("Next-hop "+best.nh+" tidak terhubung langsung ke "+d.name);
    out=j;nh=best.nh;
   }
  }else{
   const p=d.ports[0];
   if(!ready(p))return fail(d.name+": IP address / subnet mask belum diatur dengan benar");
   if(same(p.ip,p.mask,dst))nh=dst;
   else{
    if(ip2n(d.gw)===null)return fail(d.name+": tujuan beda subnet tetapi default gateway belum diisi");
    if(!same(p.ip,p.mask,d.gw))return fail(d.name+": gateway "+d.gw+" berada di luar subnet PC");
    nh=d.gw;
   }
   out=0;
  }
  if(srcIp===null)srcIp=d.ports[out].ip.trim();
  const hit=l2(d.id,out).find(e=>dev(e.dev).ports[e.port].ip.trim()===nh);
  if(!hit)return fail("Destination host unreachable: tidak ada perangkat ber-IP "+nh+" yang terjangkau (ARP gagal)");
  nodes=[...nodes,...hit.via,hit.dev];hops.push({dev:hit.dev,port:hit.port});
  cur=hit.dev;
  if(dev(cur).ports[hit.port].ip.trim()===dst)return{ok:true,nodes,hops,srcIp};
  if(dev(cur).type!=="router")return fail(dev(cur).name+" menolak paket (bukan tujuan dan bukan router)");
 }
 return fail("TTL expired in transit (kemungkinan routing loop)");
}

/* ---------- Gambar kanvas ---------- */
const svg=$("#svg"),gL=$("#gL"),gD=$("#gD"),gP=$("#gP");
const el=(n,a={},t)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;return e};
function render(){
 gL.innerHTML="";gD.innerHTML="";
 links.forEach(l=>{const a=dev(l.a),b=dev(l.b);gL.appendChild(el("line",{class:"cable",x1:a.x,y1:a.y,x2:b.x,y2:b.y}))});
 devs.forEach(d=>{
  const g=el("g",{class:"dev"+(d.id===sel?" sel":"")+(d.id===pick?" pick":""),transform:`translate(${d.x},${d.y})`,"data-id":d.id,tabindex:0});
  let shape,glyph;
  if(d.type==="router"){shape=el("circle",{class:"shape",r:27,style:"fill:#fbd5c6"});glyph="RTR"}
  else if(d.type==="switch"){shape=el("rect",{class:"shape",x:-36,y:-15,width:72,height:30,rx:3,style:"fill:#cfe8e1"});glyph="SWITCH"}
  else if(d.type==="server"){shape=el("rect",{class:"shape",x:-22,y:-30,width:44,height:60,rx:4,style:"fill:#dbe4f4"});glyph="SRV"}
  else{shape=el("rect",{class:"shape",x:-30,y:-20,width:60,height:40,rx:5});glyph="PC"}
  g.appendChild(shape);g.appendChild(el("text",{class:"glyph",y:4},glyph));
  const off=d.type==="server"?44:d.type==="router"?44:34;
  g.appendChild(el("text",{class:"name",y:off},d.name));
  const ip=d.type==="switch"?"":d.ports.map(p=>p.ip.trim()).filter(Boolean).join(" ");
  if(ip)g.appendChild(el("text",{class:"ip",y:off+14},ip));
  gD.appendChild(g);
 });
}
function anim(nodes,color){
 return new Promise(res=>{
  const pts=nodes.map(id=>dev(id)).filter(Boolean).map(d=>[d.x,d.y]);
  if(pts.length<2)return res();
  const dot=el("circle",{r:7,fill:color,stroke:"#fff","stroke-width":2});gP.appendChild(dot);
  let seg=0,t0=performance.now();const D=280;
  (function step(t){
   const k=Math.min((t-t0)/D,1),a=pts[seg],b=pts[seg+1];
   dot.setAttribute("cx",a[0]+(b[0]-a[0])*k);dot.setAttribute("cy",a[1]+(b[1]-a[1])*k);
   if(k>=1){seg++;t0=t;if(seg>=pts.length-1){dot.remove();return res()}}
   requestAnimationFrame(step);
  })(t0);
 });
}
function say(t){$("#msg").textContent=t}

/* ---------- Interaksi kanvas ---------- */
let drag=null;
const toSvg=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
svg.addEventListener("pointerdown",e=>{
 const g=e.target.closest(".dev");
 if(!g){if(mode==="select"){sel=null;pick=null;render();renderPanel();updatePrompt()}return}
 const id=+g.dataset.id;
 if(mode==="cable"){
  if(pick===null){pick=id;say("Pilih perangkat kedua untuk menyambungkan kabel.")}
  else{connect(pick,id);pick=null;renderPanel()}
  render();return;
 }
 if(mode==="delete"){removeDev(id);render();renderPanel();updatePrompt();return}
 sel=id;const d=dev(id),p=toSvg(e);drag={id,dx:p.x-d.x,dy:p.y-d.y};
 svg.setPointerCapture(e.pointerId);render();renderPanel();updatePrompt();
});
svg.addEventListener("pointermove",e=>{
 if(!drag)return;const d=dev(drag.id),p=toSvg(e);
 d.x=Math.max(40,Math.min(860,p.x-drag.dx));d.y=Math.max(40,Math.min(480,p.y-drag.dy));render();
});
svg.addEventListener("pointerup",()=>{drag=null});
document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
 const d=addDev(b.dataset.add,120+Math.random()*660,100+Math.random()*300);
 sel=d.id;render();renderPanel();updatePrompt();say(d.name+" ditambahkan. Seret untuk memindahkan.");
});
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
 mode=b.dataset.mode;pick=null;
 document.querySelectorAll("[data-mode]").forEach(x=>x.classList.toggle("on",x===b));
 say({select:"Mode pilih: klik perangkat untuk mengatur, seret untuk memindahkan.",cable:"Mode kabel: klik dua perangkat untuk menyambungkannya.",delete:"Mode hapus: klik perangkat untuk menghapusnya."}[mode]);render();
});
$("#btnClr").onclick=()=>{devs=[];links=[];sel=null;pick=null;for(const k in cnt)delete cnt[k];render();renderPanel();updatePrompt();say("Kanvas dikosongkan.")};
$("#btnEx").onclick=loadExample;

/* ---------- Panel konfigurasi ---------- */
function renderPanel(){
 const p=$("#panel"),d=dev(sel);
 if(!d){p.innerHTML='<p class="hint">Klik sebuah perangkat untuk mengatur nama dan alamat IP-nya.</p>';return}
 let h=`<h3>${TYPES[d.type].label}</h3><label>Nama perangkat<input data-k="name" value="${esc(d.name)}"></label>`;
 if(d.type==="switch"){
  h+=`<p class="hint">Switch bekerja di Layer 2: meneruskan frame di dalam satu jaringan lokal berdasarkan MAC address, sehingga tidak perlu IP.</p>`;
 }else if(d.type==="router"){
  d.ports.forEach((q,i)=>{
   const pr=peer(d.id,i);
   h+=`<fieldset><legend>eth${i} ${pr?"→ "+esc(dev(pr.dev).name):"(belum terhubung)"}</legend>
   <input data-k="ip" data-i="${i}" placeholder="IP address" value="${esc(q.ip)}" aria-label="IP eth${i}">
   <input data-k="mask" data-i="${i}" placeholder="Subnet mask" value="${esc(q.mask)}" aria-label="Mask eth${i}"></fieldset>`;
  });
  h+=`<label>Rute statis (format: jaringan mask next-hop, satu per baris)<textarea data-k="routes" rows="3" placeholder="192.168.30.0 255.255.255.0 10.0.0.2">${esc(d.routesText)}</textarea></label>`;
 }else{
  const q=d.ports[0],pr=peer(d.id,0);
  h+=`<p class="hint">Tersambung ke: ${pr?esc(dev(pr.dev).name):"belum ada kabel"}</p>
  <label>IP address<input data-k="ip" data-i="0" value="${esc(q.ip)}" placeholder="192.168.10.10"></label>
  <label>Subnet mask<input data-k="mask" data-i="0" value="${esc(q.mask)}"></label>
  <label>Default gateway<input data-k="gw" value="${esc(d.gw)}" placeholder="192.168.10.1"></label>`;
 }
 p.innerHTML=h;p.querySelectorAll("input").forEach(validate);
}
function validate(i){
 const k=i.dataset.k,v=i.value.trim();
 i.classList.toggle("invalid",(k==="ip"||k==="gw")?(v!==""&&ip2n(v)===null):k==="mask"?!validMask(v):false);
}
$("#panel").addEventListener("input",e=>{
 const t=e.target,d=dev(sel);if(!d)return;const k=t.dataset.k;
 if(k==="name"){d.name=t.value||"?";updatePrompt()}
 else if(k==="ip"||k==="mask")d.ports[+t.dataset.i][k]=t.value.trim();
 else if(k==="gw")d.gw=t.value.trim();
 else if(k==="routes"){
  d.routesText=t.value;d.routes=[];
  t.value.split("\n").forEach(l=>{const[a,b,c]=l.trim().split(/\s+/);if(ip2n(a)!==null&&validMask(b)&&ip2n(c)!==null)d.routes.push({net:a,mask:b,nh:c})});
 }
 validate(t);render();
});

/* ---------- Misi ---------- */
function renderMissions(){$("#mis").innerHTML=MISSIONS.map(([k,t])=>`<li class="${flags[k]?"done":""}">${t}</li>`).join("")}

/* ---------- Terminal ---------- */
const out=$("#out"),cmd=$("#cmd");
function print(t,c){const d=document.createElement("div");if(c)d.className=c;d.textContent=t;out.appendChild(d);out.scrollTop=out.scrollHeight}
function updatePrompt(){const d=dev(sel);$("#prompt").textContent=(d&&d.type!=="switch"?d.name:"–")+">"}
const hist=[];let hi=0;
cmd.addEventListener("keydown",e=>{
 if(e.key==="ArrowUp"&&hist.length){hi=Math.max(0,hi-1);cmd.value=hist[hi];e.preventDefault()}
 else if(e.key==="ArrowDown"){hi=Math.min(hist.length,hi+1);cmd.value=hist[hi]||"";e.preventDefault()}
 else if(e.key==="Enter"){const v=cmd.value.trim();cmd.value="";if(v){hist.push(v);hi=hist.length;run(v)}}
});
async function run(line){
 const d=dev(sel);print($("#prompt").textContent+" "+line,"sys");
 const [c,...a]=line.split(/\s+/),k=c.toLowerCase();
 if(k==="clear"||k==="cls"){out.innerHTML="";return}
 if(k==="bantuan"||k==="help"){
  print("Perintah:\n  ipconfig            tampilkan konfigurasi IP perangkat terpilih\n  ping <ip>           uji konektivitas (ICMP)\n  traceroute <ip>     lihat setiap hop menuju tujuan\n  route               tabel routing (khusus router)\n  clear               bersihkan layar\nPilih PC/Server/Router di kanvas lebih dulu.");return;
 }
 if(!d||d.type==="switch"){print("Pilih sebuah PC, Server, atau Router di kanvas untuk menjalankan perintah.","err");return}
 if(busy){print("Tunggu perintah sebelumnya selesai.","err");return}
 if(k==="ipconfig"||k==="ifconfig"){
  d.ports.forEach((p,i)=>{if(d.type==="router"&&!peer(d.id,i)&&!p.ip)return;
   print(`${d.name} eth${i}\n  IP address . . : ${p.ip||"(belum diatur)"}\n  Subnet mask  . : ${p.mask}`+(d.type!=="router"?`\n  Gateway  . . . : ${d.gw||"(kosong)"}`:""))});
 }else if(k==="route"){
  if(d.type!=="router")return print("Perintah ini hanya untuk router.","err");
  d.ports.forEach((p,i)=>{if(ready(p))print(`C  ${[netOf(p.ip,p.mask)>>>24,(netOf(p.ip,p.mask)>>>16)&255,(netOf(p.ip,p.mask)>>>8)&255,netOf(p.ip,p.mask)&255].join(".")}/${maskLen(p.mask)} terhubung langsung, eth${i}`)});
  d.routes.forEach(r=>print(`S  ${r.net}/${maskLen(r.mask)} via ${r.nh}`));
 }else if(k==="ping"||k==="traceroute"||k==="tracert"){
  if(!a[0]||ip2n(a[0])===null)return print("Pemakaian: "+k+" <alamat-ip>   contoh: "+k+" 192.168.20.10","err");
  busy=true;try{k==="ping"?await ping(d,a[0].trim()):await trace(d,a[0].trim())}finally{busy=false}
 }else print("Perintah tidak dikenal. Ketik: bantuan","err");
}
async function ping(d,dst){
 print(`Mengirim ping ke ${dst} (32 byte):`);
 const f=route(d.id,dst);let got=0;
 const b=f.ok?route(f.nodes[f.nodes.length-1],f.srcIp):null;
 for(let i=0;i<4;i++){
  await anim(f.nodes,f.ok?"#e4572e":"#c0392b");
  if(!f.ok){print(f.msg,"err");flags.m3=1;continue}
  if(!b.ok){await anim(b.nodes,"#c0392b");print("Request timed out. Balasan tidak bisa kembali: "+b.msg,"err");flags.m3=1;continue}
  await anim([...f.nodes].reverse(),"#1b8a5a");
  const rt=f.hops.slice(0,-1).filter(h=>dev(h.dev).type==="router").length;
  print(`Balasan dari ${dst}: bytes=32 waktu=${Math.max(1,Math.round(f.nodes.length*1.5+Math.random()*2))}ms TTL=${128-rt}`);got++;
  if(f.hops.some(h=>dev(h.dev).type==="router"&&h.dev!==f.nodes[f.nodes.length-1]))flags.m2=1;else flags.m1=1;
 }
 print(`Statistik: dikirim 4, diterima ${got}, hilang ${4-got} (${(4-got)*25}% loss)`,got?"":"err");
 renderMissions();
}
async function trace(d,dst){
 flags.m4=1;renderMissions();
 print(`Melacak rute ke ${dst} (maks 16 hop):`);
 const f=route(d.id,dst);
 for(let i=0;i<f.hops.length;i++){
  const h=f.hops[i],x=dev(h.dev);
  await sleep(250);print(`${String(i+1).padStart(2)}  ${x.ports[h.port].ip.padEnd(16)} ${x.name}  ${i+1+Math.round(Math.random()*2)} ms`);
 }
 if(f.ok){await anim(f.nodes,"#e4572e");print("Trace selesai.")}
 else{await sleep(250);print(`${String(f.hops.length+1).padStart(2)}  * * *   ${f.msg}`,"err");flags.m3=1;renderMissions()}
}
